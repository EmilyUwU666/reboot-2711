name: Compile Fortnite 27.11 DLLs
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract prepared source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = 'Reboot-27.11-Source.zip'
          $expected = 'c456b97c0a224866e017467949bf53799490760412628c01f85c531f20ab8a96'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected) { throw 'Source ZIP does not match the prepared version.' }
          Expand-Archive -LiteralPath $archive -DestinationPath source
      - name: Apply revision 2
        shell: bash
        run: |
          git apply --check --directory=source/Reboot-27.11-Source build-support/revision2.patch
          git apply --directory=source/Reboot-27.11-Source build-support/revision2.patch
      - name: Test startup lookup and version guard
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX source\Reboot-27.11-Source\tests\process_event_lookup_tests.cpp /Fe:lookup-tests.exe
          if errorlevel 1 exit /b 1
          lookup-tests.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX source\Reboot-27.11-Source\tests\build_version_tests.cpp /Fe:version-tests.exe
          if errorlevel 1 exit /b 1
          version-tests.exe
          if errorlevel 1 exit /b 1
      - name: Package corresponding revision 2 source
        shell: python
        run: |
          from pathlib import Path
          import zipfile
          root = Path('source/Reboot-27.11-Source')
          with zipfile.ZipFile('Reboot-27.11-Revision2-Source.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for f in root.rglob('*'):
                  if f.is_file():
                      z.write(f, f.relative_to(root.parent))
      - name: Compile server and client
        shell: pwsh
        run: ./source/Reboot-27.11-Source/scripts/Build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Reboot-27.11-Revision2-Windows-x64
          path: source/Reboot-27.11-Source/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Reboot-27.11-Revision2-Source
          path: Reboot-27.11-Revision2-Source.zip
          if-no-files-found: error
